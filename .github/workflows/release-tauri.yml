name: 'Release Tauri Multi-Platform App (Desktop & Android)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-desktop:
    name: 'Build Desktop App (${{ matrix.platform }})'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci || npm install --include=optional --force

      - name: Build and Package Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TANKHOR v__VERSION__'
          releaseBody: 'انتشار نسخه چندپلتفرمه تن‌خور (ویندوز، مک و اندروید) با پشتیبانی کامل از دیتابیس آفلاین محلی و همگام‌سازی ابری.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  generate-updater-json:
    name: 'Generate & Upload latest.json'
    needs: release-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets and publish latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "$TAG_NAME" --repo "$REPO" --dir . || true
          ls -la

          node -e '
          const fs = require("fs");

          const tag = process.env.TAG_NAME || "v1.0.7";
          const version = tag.replace(/^v/, "");
          const repo = process.env.REPO || "brandyar/Tankhor";
          const files = fs.readdirSync(".");

          console.log("All downloaded release assets:", files);

          const platforms = {};

          // Helper to read signature file content
          function getSignature(filename) {
            const candidates = [
              filename + ".sig",
              filename.replace(/\.zip$/, ".nsis.zip.sig"),
              filename.replace(/\.exe$/, ".exe.sig"),
              filename.replace(/\.tar\.gz$/, ".app.tar.gz.sig")
            ];
            for (const cand of candidates) {
              if (fs.existsSync(cand)) {
                return fs.readFileSync(cand, "utf8").trim();
              }
            }
            return null;
          }

          // 1. First gather all signatures
          const signatures = {};
          files.filter(f => f.endsWith(".sig")).forEach(sigFile => {
            const baseName = sigFile.slice(0, -4);
            const content = fs.readFileSync(sigFile, "utf8").trim();
            signatures[sigFile] = content;
            signatures[baseName] = content;
            console.log(`Found signature for: ${baseName}`);
          });

          // 2. Check if an existing latest.json or updater JSON was uploaded by tauri-action
          files.filter(f => f.endsWith(".json") && f !== "latest.json").forEach(jsonFile => {
            try {
              const data = JSON.parse(fs.readFileSync(jsonFile, "utf8"));
              if (data.platforms) {
                Object.assign(platforms, data.platforms);
                console.log(`Merged platforms from ${jsonFile}:`, Object.keys(data.platforms));
              }
            } catch (e) {
              console.warn(`Could not parse ${jsonFile}:`, e.message);
            }
          });

          // 3. Identify macOS Updater Asset (.app.tar.gz or .tar.gz ONLY)
          const macArchive = files.find(f => f.endsWith(".app.tar.gz") || (f.includes("universal") && f.endsWith(".tar.gz")) || f.endsWith(".tar.gz"));
          if (macArchive) {
            const macSig = signatures[macArchive] || signatures[macArchive + ".sig"];
            if (macSig) {
              const macUrl = `https://github.com/${repo}/releases/download/${tag}/${macArchive}`;
              console.log(`Resolved valid macOS updater asset: ${macArchive}`);

              const macTargets = [
                "darwin-aarch64",
                "darwin-aarch64-app",
                "darwin-x86_64",
                "darwin-x86_64-app",
                "darwin-universal",
                "darwin-universal-app",
                "darwin-arm64",
                "darwin-arm64-app"
              ];

              macTargets.forEach(target => {
                if (!platforms[target]) {
                  platforms[target] = { signature: macSig, url: macUrl };
                }
              });
            } else {
              console.warn(`macOS archive ${macArchive} found but missing .sig signature!`);
            }
          }

          // 4. Identify Windows Updater Assets (.nsis.zip vs -setup.exe vs .msi.zip)
          const winNsisZip = files.find(f => f.endsWith(".nsis.zip") || f.includes("-setup.nsis.zip") || (f.endsWith(".zip") && f.toLowerCase().includes("nsis")));
          const winNsisExe = files.find(f => (f.endsWith("-setup.exe") || (f.endsWith(".exe") && !f.endsWith(".sig"))) && !f.includes("darwin"));
          const winMsiArchive = files.find(f => f.endsWith(".msi.zip") || (f.endsWith(".zip") && f.toLowerCase().includes("msi")));
          const winGenericZip = files.find(f => f.endsWith(".zip") && !f.includes("darwin") && !f.endsWith(".nsis.zip") && !f.endsWith(".msi.zip"));

          // A) NSIS Installer targets (Prefer .nsis.zip if present, otherwise direct .exe installer)
          const nsisArchive = winNsisZip || winNsisExe || (winGenericZip && !winMsiArchive ? winGenericZip : null);
          if (nsisArchive) {
            const nsisSig = signatures[nsisArchive] || signatures[nsisArchive + ".sig"] || getSignature(nsisArchive);
            if (nsisSig) {
              const nsisUrl = `https://github.com/${repo}/releases/download/${tag}/${nsisArchive}`;
              console.log(`Resolved NSIS Windows updater asset: ${nsisArchive}`);

              const nsisTargets = [
                "windows-x86_64",
                "windows-x86_64-nsis",
                "windows-i686",
                "windows-i686-nsis",
                "windows-x86"
              ];

              nsisTargets.forEach(target => {
                if (!platforms[target]) {
                  platforms[target] = { signature: nsisSig, url: nsisUrl };
                }
              });
            } else {
              console.warn(`NSIS Windows archive ${nsisArchive} found but missing .sig signature!`);
            }
          }

          // B) MSI Installer targets
          if (winMsiArchive) {
            const msiSig = signatures[winMsiArchive] || signatures[winMsiArchive + ".sig"] || getSignature(winMsiArchive);
            if (msiSig) {
              const msiUrl = `https://github.com/${repo}/releases/download/${tag}/${winMsiArchive}`;
              console.log(`Resolved MSI Windows updater asset: ${winMsiArchive}`);

              const msiTargets = [
                "windows-x86_64-msi",
                "windows-i686-msi"
              ];

              msiTargets.forEach(target => {
                if (!platforms[target]) {
                  platforms[target] = { signature: msiSig, url: msiUrl };
                }
              });
            } else {
              console.warn(`MSI Windows archive ${winMsiArchive} found but missing .sig signature!`);
            }
          }

          // 5. Identify Linux Asset & Signature if present
          const linuxAsset = files.find(f => f.endsWith(".AppImage.tar.gz") || f.endsWith(".appimage.tar.gz"));
          if (linuxAsset) {
            const linuxSig = signatures[linuxAsset] || signatures[linuxAsset + ".sig"];
            if (linuxSig) {
              const linuxUrl = `https://github.com/${repo}/releases/download/${tag}/${linuxAsset}`;
              if (!platforms["linux-x86_64"]) platforms["linux-x86_64"] = { signature: linuxSig, url: linuxUrl };
              if (!platforms["linux-x86_64-appimage"]) platforms["linux-x86_64-appimage"] = { signature: linuxSig, url: linuxUrl };
            }
          }

          const manifest = {
            version: version,
            notes: `بروزرسانی نسخه ${version} نرم‌افزار تن‌خور (پشتیبانی کامل ویندوز، مک و اندروید)`,
            pub_date: new Date().toISOString(),
            platforms: platforms
          };

          console.log("Final Generated latest.json Platforms:\n", Object.keys(platforms));
          console.log("Full latest.json Content:\n", JSON.stringify(manifest, null, 2));
          fs.writeFileSync("../latest.json", JSON.stringify(manifest, null, 2));
          '

          if [ -f "../latest.json" ]; then
            gh release upload "$TAG_NAME" ../latest.json --repo "$REPO" --clobber
            echo "latest.json uploaded successfully!"
          else
            echo "latest.json creation skipped or failed"
          fi

  release-android:
    name: 'Build Android APK'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci || npm install --include=optional --force

      - name: Build Vite Web Assets
        run: npx vite build

      - name: Initialize Android project if needed
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android init || true

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android build --apk --target aarch64

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tankhor-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
