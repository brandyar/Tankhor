name: 'Release Tauri Multi-Platform App (Desktop & Android)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-desktop:
    name: 'Build Desktop App (${{ matrix.platform }})'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci || npm install --include=optional --force

      - name: Build and Package Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TANKHOR v__VERSION__'
          releaseBody: 'انتشار نسخه چندپلتفرمه تن‌خور (ویندوز، مک و اندروید) با پشتیبانی کامل از دیتابیس آفلاین محلی و همگام‌سازی ابری.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  generate-updater-json:
    name: 'Generate & Upload latest.json'
    needs: release-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets and publish latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "$TAG_NAME" --repo "$REPO" --dir . || true
          ls -la

          node -e '
          const fs = require("fs");

          const tag = process.env.TAG_NAME || "v1.0.1";
          const version = tag.replace(/^v/, "");
          const repo = process.env.REPO || "brandyar/Tankhor";
          const files = fs.readdirSync(".");

          const platforms = {};

          function getSignature(filename) {
            const sigFile = filename + ".sig";
            if (fs.existsSync(sigFile)) {
              return fs.readFileSync(sigFile, "utf8").trim();
            }
            return null;
          }

          files.forEach(file => {
            if (file.endsWith(".sig") || file === "latest.json") return;

            const sig = getSignature(file);
            if (!sig) return;

            const downloadUrl = `https://github.com/${repo}/releases/download/${tag}/${file}`;

            // macOS assets
            if (file.includes("universal") || file.endsWith(".app.tar.gz") || file.endsWith(".dmg")) {
              platforms["darwin-aarch64"] = { signature: sig, url: downloadUrl };
              platforms["darwin-x86_64"] = { signature: sig, url: downloadUrl };
            } else if (file.includes("aarch64") && (file.endsWith(".tar.gz") || file.endsWith(".dmg"))) {
              platforms["darwin-aarch64"] = { signature: sig, url: downloadUrl };
            } else if (file.includes("x86_64") && file.includes("apple") && (file.endsWith(".tar.gz") || file.endsWith(".dmg"))) {
              platforms["darwin-x86_64"] = { signature: sig, url: downloadUrl };
            }

            // Windows assets
            if (file.endsWith(".nsis.zip") || file.endsWith(".msi.zip") || (file.includes("x64") && file.endsWith(".zip"))) {
              platforms["windows-x86_64"] = { signature: sig, url: downloadUrl };
            } else if (file.endsWith(".exe") && sig) {
              if (!platforms["windows-x86_64"]) {
                platforms["windows-x86_64"] = { signature: sig, url: downloadUrl };
              }
            }
          });

          const manifest = {
            version: version,
            notes: `بروزرسانی نسخه ${version} نرم‌افزار تن‌خور`,
            pub_date: new Date().toISOString(),
            platforms: platforms
          };

          console.log("Generated latest.json:\n", JSON.stringify(manifest, null, 2));
          fs.writeFileSync("../latest.json", JSON.stringify(manifest, null, 2));
          '

          if [ -f "../latest.json" ]; then
            gh release upload "$TAG_NAME" ../latest.json --repo "$REPO" --clobber
            echo "latest.json uploaded successfully!"
          else
            echo "latest.json creation skipped or failed"
          fi

  release-android:
    name: 'Build Android APK'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci || npm install --include=optional --force

      - name: Build Vite Web Assets
        run: npx vite build

      - name: Initialize Android project if needed
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android init || true

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android build --apk --target aarch64

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tankhor-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
